name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compute-version:
    name: Compute CalVer version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute version
        id: version
        shell: bash
        run: |
          version="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build-matrix:
    name: Build ${{ matrix.target }}
    needs: compute-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            format: tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            format: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            format: tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            format: tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            format: zip
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            format: zip
            use_cross: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p token-usage-cli --bins
          else
            cargo build --release --target "${{ matrix.target }}" -p token-usage-cli --bins
          fi

      - name: Package release archive (Unix)
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          archive="token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}.tar.gz"
          staging="token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/token-usage-reporter" "${staging}/"
          cp "target/${{ matrix.target }}/release/token-usage-api" "${staging}/"
          cp README.md LICENSE "${staging}/"
          tar -czf "${archive}" "${staging}"

      - name: Package release archive (Windows)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $archive = "token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}.zip"
          $staging = "token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/token-usage-reporter.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/token-usage-api.exe" $staging
          Copy-Item README.md, LICENSE $staging
          7z a $archive $staging

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}
          path: token-usage-${{ needs.compute-version.outputs.tag }}-${{ matrix.target }}.${{ matrix.format }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - compute-version
      - build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: token-usage-${{ needs.compute-version.outputs.tag }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: ${{ needs.compute-version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
