[package]
name = "toktally-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API and CLI for toktally"

[lib]
name = "toktally_cli"
path = "src/lib.rs"

[[bin]]
name = "toktally-api"
path = "src/bin/toktally-api.rs"

[[bin]]
name = "toktally"
path = "src/bin/toktally.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toktally-adapters.workspace = true
toktally-domain.workspace = true
toktally-store.workspace = true
toktally-sync.workspace = true
ureq.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
