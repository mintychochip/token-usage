[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/store",
    "crates/adapters",
    "crates/sync",
    "crates/cli",
    "crates/widgets-api",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
toktally-domain = { path = "crates/domain" }
toktally-store = { path = "crates/store" }
toktally-adapters = { path = "crates/adapters" }
toktally-sync = { path = "crates/sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
tower = "0.5"
http-body-util = "0.1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
