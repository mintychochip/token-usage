[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/store",
    "crates/adapters",
    "crates/cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
token-usage-domain = { path = "crates/domain" }
token-usage-store = { path = "crates/store" }
token-usage-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
tower = "0.5"
http-body-util = "0.1"
