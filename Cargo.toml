[workspace]
resolver = "2"
members = [
    "crates/domain",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
token-usage-domain = { path = "crates/domain" }
token-usage-store = { path = "crates/store" }
token-usage-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
